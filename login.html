{% extends 'portfolio/base.html' %}

{% block content %}
<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
    }
    .auth-card {
        background: white;
        border-radius: 24px;
        padding: 45px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 20px 60px rgba(10,36,99,0.12);
        transform: perspective(1000px) rotateY(0deg);
        transition: transform 0.4s;
    }
    .auth-card:hover { transform: perspective(1000px) rotateY(-2deg); }
    .auth-logo { text-align: center; margin-bottom: 30px; }
    .auth-logo h2 { font-size: 28px; color: #0a2463; font-weight: 700; }
    .auth-logo h2 span { color: #1e6fcf; }
    .auth-logo p { color: #888; font-size: 14px; margin-top: 5px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { font-size: 12px; font-weight: 700; color: #0a2463; display: block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e8f0fe;
        border-radius: 12px;
        font-size: 14px;
        font-family: 'Poppins', sans-serif;
        outline: none;
        background: #f8faff;
        transition: all 0.3s;
    }
    .form-group input:focus { border-color: #1e6fcf; background: white; box-shadow: 0 0 0 4px rgba(30,111,207,0.1); }
    .auth-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #0a2463, #1e6fcf);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        font-family: 'Poppins', sans-serif;
        transition: transform 0.3s, box-shadow 0.3s;
        box-shadow: 0 8px 25px rgba(30,111,207,0.4);
    }
    .auth-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(30,111,207,0.5); }
    .auth-link { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
    .auth-link a { color: #1e6fcf; font-weight: 600; text-decoration: none; }
    .error-msg { background: #ffe8e8; color: #e74c3c; padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 20px; border-left: 4px solid #e74c3c; }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <h2>Welcome <span>Back</span> 👋</h2>
            <p>Login to access your dashboard</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="error-msg">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="auth-btn">Login 🚀</button>
        </form>

        <div class="auth-link">
            Don't have an account? <a href="{% url 'register' %}">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
